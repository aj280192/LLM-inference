[project]
name = "reportapp"
dynamic = ["version"]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
# version is derived purely from git tags — no version string in code

[tool.semantic_release]
tag_format = "v{version}"
branch = "main"

# main is protected with "Allowed to push: No one" (doc 11). The release:tag
# job in .gitlab-ci.yml handles this by tagging directly rather than relying
# on semantic-release's default commit-then-tag behavior:
commit_version_number = false   # never create a version-bump commit
changelog_file = ""             # changelog goes to a GitLab Release, not a repo commit

# NOTE: no [tool.semantic_release.branches.*] section needed. Earlier
# designs required branch-specific rules (patch-only on a hotfix branch)
# specifically to avoid version collisions between main and a hotfix
# branch. The final design has NO hotfix branches at all — every fix is a
# normal merge to main, tagged at merge time like everything else — so
# there is nothing for branch-specific rules to disambiguate.
