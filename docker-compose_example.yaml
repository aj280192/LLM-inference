# /opt/apps/reportapp/docker-compose.yml on each VM.
# IMAGE_REF substituted by deploy.sh; .env rendered by Vault Agent.
services:
  reportapp:
    image: ${IMAGE_REF}
    env_file: [.env]
    ports: ["${APP_PORT:-8501}:8501"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 1g
    cpus: 1.0
    restart: unless-stopped
    networks: [reportapp-net]
networks:
  reportapp-net:
    driver: bridge
