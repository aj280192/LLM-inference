# ============================================================================
# GitLab CI pipeline — reportapp (Streamlit AI app)
# GitLab 14.x compatible | shell-executor runners
#
# NAMING CONVENTION (industry standard, applied throughout):
#   STAGES  = plain phase names, kebab-case          e.g. "deploy-prod"
#   JOBS    = "verb:target" pattern, colon-separated  e.g. "deploy:prod"
# This keeps stage headers and job names visually distinct in the pipeline
# graph, and every job name is self-describing regardless of which stage
# it sits in (no more "which one is the stage vs the job" ambiguity).
#
# Runner topology (tags: decide WHERE a job runs):
#   tags: build   -> dedicated build box (docker, jf CLI, python, syft)
#   tags: dev     -> runner registered ON the dev VM
#   tags: int     -> runner registered ON the int VM
#   tags: prod    -> runner registered ON the prod VM
#
# Environments (environment: decides deployment history + approval gates —
# ONLY declared on jobs that actually change what's running somewhere):
#   dev, int, prod — exactly 3. promote:staging/promote:stable get none,
#   because they only move artifacts between JFrog repos, they don't deploy.
#
# Branches handled:
#   main          -> normal development; auto-deploys dev; release job
#                    computes MINOR/MAJOR/PATCH bumps
#   release/X.Y   -> hotfix branches. Never deploys to dev. release job on
#                    this branch is constrained to PATCH bumps only.
#   v* tags       -> produced by either branch above; triggers the SAME
#                    promotion pipeline regardless of source branch.
#
# Versioning: computed ONCE in version:compute, baked into the image via
# SETUPTOOLS_SCM_PRETEND_VERSION (APP_VERSION, PEP440) and used separately
# as the Docker tag (BUILD_VERSION, Docker-tag-legal characters only) —
# both derived from the same pipeline ID + short SHA, so they're always
# traceable to each other even though the character sets differ.
#
# Scanning: enforced by JFrog Xray policy AT PROMOTION TIME (critical=block,
# high=require approval, medium=notify). No standalone blocking scan job.
#
# Release flow: main and release/* are protected with "Allowed to push: No
# one" — release:tag never commits to either branch. It tags the existing
# commit directly and pushes only the tag.
#
# Rollback — standard 2-layer design, no time-bound expiry:
#   1. AUTOMATIC: deploy.sh rolls back on failed health check; smoke test
#      failure triggers the same rollback via after_script. No human needed.
#   2. MANUAL: rollback:int / rollback:prod are standing `when: manual`
#      jobs in the same tag pipeline — clickable any time, no expiry.
#   GitLab also provides a native "Rollback" button on the Environment's
#   deployment history (redeploys an older successful deployment job as-is)
#   — a good complementary option for "redeploy exactly what was running
#   3 releases ago," while rollback:prod covers "redeploy whatever the
#   immediately-previous version was" using the VM-local previous-version
#   record (see ci/rollback.sh).
# ============================================================================

variables:
  IMAGE_NAME: "reportapp"
  DOCKER_REGISTRY: "jfrog.company.com"
  SCRATCH_REPO: "docker-scratch-local"
  STAGING_REPO: "docker-staging-local"
  STABLE_REPO: "docker-stable-local"
  SBOM_REPO: "generic-sboms-local"
  APP_DIR: "/opt/apps/reportapp"
  GIT_DEPTH: 0   # full history needed everywhere semantic-release runs

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/'
    - if: '$CI_COMMIT_TAG'
    # anything else (plain feature-branch pushes with no MR) creates no pipeline

stages:
  - validate
  - test
  - version
  - build
  - publish
  - deploy-dev
  - integration
  - release
  - promote-staging
  - deploy-int
  - e2e-int
  - promote-stable
  - deploy-prod
  - smoke-prod

# ----------------------------------------------------------------------------
# STAGE: validate — MR pipelines only
# ----------------------------------------------------------------------------
lint:commit-message:
  stage: validate
  tags: [build]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pip install --quiet commitizen
    # checks the MR TITLE only — that's what becomes the squash commit,
    # and the only thing semantic-release ever reads (doc 11 §6).
    - echo "$CI_MERGE_REQUEST_TITLE" | cz check --message -
  allow_failure: true   # remove once the team is used to the format

# ----------------------------------------------------------------------------
# STAGE: test — white-box, source-code level, every MR
# ----------------------------------------------------------------------------
lint:code:
  stage: test
  tags: [build]
  script:
    - uv sync --frozen
    - uv run ruff check .
    - uv run mypy app/
    - uv run bandit -r app/ -ll

test:unit:
  stage: test
  tags: [build]
  script:
    - uv sync --frozen
    - uv run pytest tests/unit tests/streamlit_apptest -m "not integration" \
        --junitxml=report.xml --cov=app
  artifacts:
    when: always
    reports:
      junit: report.xml

scan:source-dependencies:
  stage: test
  tags: [build]
  script:
    - uv sync --frozen
    - uv run pip-audit --format=cyclonedx-json -o sbom-source-deps.json
  artifacts:
    paths: [sbom-source-deps.json]
  allow_failure: true   # informational at MR time; the real gate is post-build image scan

# ----------------------------------------------------------------------------
# STAGE: version — computed ONCE, before build. Dry run only, pushes nothing.
# ----------------------------------------------------------------------------
version:compute:
  stage: version
  tags: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/'
  script:
    - pip install --quiet python-semantic-release
    - export NEXT_VERSION=$(semantic-release version --print)
    - |
      if [ -z "$NEXT_VERSION" ]; then
        echo "No feat/fix commits since last tag — nothing release-worthy."
        echo "NEXT_VERSION=" > version.env
      else
        echo "Computed next version: $NEXT_VERSION (branch: $CI_COMMIT_BRANCH)"
        echo "NEXT_VERSION=$NEXT_VERSION" > version.env
      fi
  artifacts:
    reports:
      dotenv: version.env

# ----------------------------------------------------------------------------
# STAGE: build
# ----------------------------------------------------------------------------
build:image:
  stage: build
  tags: [build]
  needs: [version:compute]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/'
  script:
    - |
      if [ -z "$NEXT_VERSION" ]; then
        export APP_VERSION="0.0.0.dev${CI_PIPELINE_IID}+${CI_COMMIT_SHORT_SHA}"
        export BUILD_VERSION="0.0.0-dev${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        export APP_VERSION="${NEXT_VERSION}.dev${CI_PIPELINE_IID}+${CI_COMMIT_SHORT_SHA}"
        export BUILD_VERSION="${NEXT_VERSION}-dev${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"
      fi
    # APP_VERSION: PEP440-valid, baked into the app via setuptools-scm
    # BUILD_VERSION: Docker-tag-legal (no '+'), used as the image tag
    - echo "APP_VERSION=$APP_VERSION" > build.env
    - echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
    - export SETUPTOOLS_SCM_PRETEND_VERSION=$APP_VERSION
    - docker build
        --build-arg APP_VERSION=$APP_VERSION
        -t $DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION .
    - jf rt build-collect-env reportapp-build $CI_PIPELINE_ID
    - jf rt build-add-git reportapp-build $CI_PIPELINE_ID
  artifacts:
    reports:
      dotenv: build.env

build:sbom:
  stage: build
  tags: [build]
  needs: [build:image]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/'
  script:
    - syft $DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION
        -o cyclonedx-json=sbom-$BUILD_VERSION.cdx.json
        -o spdx-json=sbom-$BUILD_VERSION.spdx.json
    - jf rt upload "sbom-$BUILD_VERSION.*.json"
        "$SBOM_REPO/$IMAGE_NAME/$BUILD_VERSION/"
        --build-name=reportapp-build --build-number=$CI_PIPELINE_ID
  artifacts:
    paths: ["sbom-*.json"]

# ----------------------------------------------------------------------------
# STAGE: publish
# ----------------------------------------------------------------------------
publish:scratch:
  stage: publish
  tags: [build]
  needs: [build:image, build:sbom]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/'
  script:
    - docker push $DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION
    - jf rt build-publish reportapp-build $CI_PIPELINE_ID
  artifacts:
    reports:
      dotenv: build.env

publish:wait-for-scan:
  stage: publish
  tags: [build]
  needs: [publish:scratch]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/'
  script:
    # ensures Xray finished indexing before promotion is attempted;
    # --fail=false because THIS job doesn't enforce severity — promotion does
    - jf rt build-scan reportapp-build $CI_PIPELINE_ID --fail=false --vuln
  artifacts:
    reports:
      dotenv: build.env

# ----------------------------------------------------------------------------
# STAGE: deploy-dev — auto, ONLY on main. Never runs for release/* branches:
# dev tracks main's HEAD, which may already be ahead of a hotfix release.
# ----------------------------------------------------------------------------
deploy:dev:
  stage: deploy-dev
  tags: [dev]
  needs: [publish:wait-for-scan]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: dev
  resource_group: dev
  script:
    - export IMAGE="$DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION"
    - ./ci/deploy.sh dev "$IMAGE" "$BUILD_VERSION"

test:smoke-dev:
  stage: deploy-dev
  tags: [dev]
  needs: [deploy:dev]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    BASE_URL: "http://localhost:8501"
  script:
    - ./ci/run-e2e.sh smoke

# ----------------------------------------------------------------------------
# STAGE: integration — white-box, real throwaway DB, source-level
# ----------------------------------------------------------------------------
test:integration:
  stage: integration
  tags: [build]
  needs:
    - job: test:smoke-dev
      optional: true      # only exists on the main path; release/* skips it
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/'
  services:
    - postgres:15
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: "postgresql://test:test@postgres/testdb"
  script:
    - uv sync --frozen
    - uv run pytest tests/integration -m integration --junitxml=integration-report.xml
  artifacts:
    when: always
    reports:
      junit: integration-report.xml

# ----------------------------------------------------------------------------
# STAGE: release — tags the EXISTING commit, never pushes a commit to
# main/release/*. Pushing the tag triggers a NEW pipeline (promotion, below).
# ----------------------------------------------------------------------------
release:tag:
  stage: release
  tags: [build]
  needs: [version:compute, test:integration]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH =~ /^release\/\d+\.\d+$/'
  script:
    - |
      if [ -z "$NEXT_VERSION" ]; then
        echo "No release-worthy commits since last tag. Skipping release."
        exit 0
      fi
    - pip install --quiet python-semantic-release
    - git remote set-url origin "https://release-bot:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      RECHECK=$(semantic-release version --print)
      if [ "$RECHECK" != "$NEXT_VERSION" ]; then
        echo "Version drift detected: computed $NEXT_VERSION earlier, now $RECHECK."
        exit 1
      fi
    - semantic-release changelog > release-notes.md
    - git tag -a "v${NEXT_VERSION}" -m "v${NEXT_VERSION}"
    - git push origin "v${NEXT_VERSION}"      # tag push only — allowed (protected tag: Maintainers)
    - release-cli create --tag-name "v${NEXT_VERSION}" --name "v${NEXT_VERSION}"
        --description "$(cat release-notes.md)"
  artifacts:
    paths: [release-notes.md]

# ============================================================================
# Everything below runs ONLY on tag pipelines — identical whether the tag
# came from main or a release/* hotfix branch.
# ============================================================================

# ----------------------------------------------------------------------------
# STAGE: promote-staging — re-tags the SAME digest. Not a deployment: no
# `environment:` block. Xray severity enforcement happens here.
# ----------------------------------------------------------------------------
promote:staging:
  stage: promote-staging
  tags: [build]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - export SRC_TAG=$(jf rt search "$SCRATCH_REPO/$IMAGE_NAME/*" --props="vcs.revision=$CI_COMMIT_SHA" | jq -r '.[0].path' | xargs basename)
    - |
      if ! jf rt build-promote reportapp-build $CI_PIPELINE_ID $STAGING_REPO --copy=true 2> promote-error.log; then
        if grep -qi "pending approval" promote-error.log; then
          echo "High-severity CVE found — promotion pending approval in JFrog:"
          echo "  https://$DOCKER_REGISTRY/ui/bundles/${IMAGE_NAME}/${VERSION}"
          exit 1   # approve in JFrog, then Retry this job — no rebuild needed
        fi
        cat promote-error.log
        exit 1
      fi
    - jf rt docker-promote $IMAGE_NAME $SCRATCH_REPO $STAGING_REPO
        --source-tag=$SRC_TAG --target-tag=$VERSION --copy=true
  artifacts:
    reports:
      dotenv: build.env

# ----------------------------------------------------------------------------
# STAGE: deploy-int
# ----------------------------------------------------------------------------
deploy:int:
  stage: deploy-int
  tags: [int]
  needs: [promote:staging]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: int
  resource_group: int
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - export IMAGE="$DOCKER_REGISTRY/$STAGING_REPO/$IMAGE_NAME:$VERSION"
    - ./ci/deploy.sh int "$IMAGE" "$VERSION"

# Standard standing manual rollback — no expiry. Clickable any time this
# pipeline exists, redeploys whatever int's PREVIOUS_VERSION marker holds.
rollback:int:
  stage: deploy-int
  tags: [int]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  environment:
    name: int
  script:
    - ./ci/rollback.sh int

# ----------------------------------------------------------------------------
# STAGE: e2e-int — black-box, full flow, real int deployment
# ----------------------------------------------------------------------------
test:e2e-int:
  stage: e2e-int
  tags: [int]
  needs: [deploy:int]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  variables:
    BASE_URL: "http://localhost:8501"
  script:
    - ./ci/run-e2e.sh e2e
  artifacts:
    when: always
    reports:
      junit: tests/e2e-report.xml

test:evaluation:
  stage: e2e-int
  tags: [build]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - export VAULT_TOKEN=$(vault write -field=token auth/jwt/login role=reportapp-ci jwt=$CI_JOB_JWT)
    - export LLM_API_KEY=$(vault kv get -field=api_key secret/reportapp/ci-eval)
    - uv sync --frozen
    - uv run pytest tests/evaluation --junitxml=eval-report.xml
  artifacts:
    when: always
    reports:
      junit: eval-report.xml

# ----------------------------------------------------------------------------
# STAGE: promote-stable — manual. NOT a deployment (no environment: block).
# Same Xray severity enforcement as promote:staging.
# ----------------------------------------------------------------------------
promote:stable:
  stage: promote-stable
  tags: [build]
  needs: [test:e2e-int, test:evaluation]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - |
      if ! jf rt docker-promote $IMAGE_NAME $STAGING_REPO $STABLE_REPO \
          --source-tag=$VERSION --target-tag=$VERSION --copy=true 2> promote-error.log; then
        if grep -qi "pending approval" promote-error.log; then
          echo "High-severity CVE found — promotion pending approval in JFrog."
          exit 1   # approve, then Retry
        fi
        cat promote-error.log
        exit 1
      fi
    - jf rt docker-promote $IMAGE_NAME $STAGING_REPO $STABLE_REPO
        --source-tag=$VERSION --target-tag=stable --copy=true
  artifacts:
    reports:
      dotenv: build.env

# ----------------------------------------------------------------------------
# STAGE: deploy-prod — manual. The ONE real human gate before prod.
# ----------------------------------------------------------------------------
deploy:prod:
  stage: deploy-prod
  tags: [prod]
  needs: [promote:stable]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  environment:
    name: prod
  resource_group: prod
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - export IMAGE="$DOCKER_REGISTRY/$STABLE_REPO/$IMAGE_NAME:$VERSION"
    - ./ci/deploy.sh prod "$IMAGE" "$VERSION"
    # record deployment on the artifact for CVE/runtime correlation:
    # only THIS version is now "live" — whichever branch it came from
    - jf rt set-props "$STABLE_REPO/$IMAGE_NAME/$VERSION" "deployed.prod=true"

# Standard standing manual rollback — no expiry, no time-bound cleanup job.
# Redeploys whatever prod's PREVIOUS_VERSION marker holds (updated on every
# deploy.sh run). Clickable at any point this pipeline still exists.
#
# Complementary native option: GitLab's Environments page also offers a
# built-in "Rollback" button per historical deployment, which simply
# re-runs that older deploy job as-is — useful for "go back further than
# one step," since rollback:prod here only ever targets the immediately
# previous version.
rollback:prod:
  stage: deploy-prod
  tags: [prod]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  environment:
    name: prod
  script:
    - ./ci/rollback.sh prod

# ----------------------------------------------------------------------------
# STAGE: smoke-prod — black-box, login-only, blocking with auto-rollback.
# Full query check is non-blocking (LLM hiccups shouldn't roll back a
# healthy deploy).
# ----------------------------------------------------------------------------
test:smoke-prod:
  stage: smoke-prod
  tags: [prod]
  needs: [deploy:prod]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  variables:
    BASE_URL: "https://reportapp.company.com"
  script:
    - ./ci/run-e2e.sh smoke
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "Smoke test failed — rolling back prod"
        ./ci/rollback.sh prod
      fi

test:smoke-prod-full-query:
  stage: smoke-prod
  tags: [prod]
  needs: [test:smoke-prod]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  allow_failure: true   # a real LLM call, monitored but never blocks a healthy release
  script:
    - ./ci/run-e2e.sh smoke-full
