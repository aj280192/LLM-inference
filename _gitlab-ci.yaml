# ============================================================================
# GitLab CI pipeline — reportapp (Streamlit AI app)
# GitLab 14.x compatible | shell-executor runners
#
# ============================================================================
# FINAL DESIGN SUMMARY (the conclusions this file implements)
# ============================================================================
#
# VERSIONING: tagged AT MERGE TIME (like the original design) — NOT after
# UAT approval. semantic-release always runs against live HEAD, which is
# what the tooling expects, and this avoids the SHA/version mixed-identifier
# problem and the non-atomic "tag+promote+deploy in one job" problem that a
# late-tagging design creates.
#
# CONCURRENCY: int is ONE physical VM — modeled explicitly via an atomic
# occupancy lock (ci/nominate-int.sh), not assumed away. Only one UAT
# candidate occupies int at a time. A second nomination is refused with a
# clear message unless explicitly forced.
#
# HOTFIX: NOT a separate branch or pipeline path. A hotfix is a normal
# fix: commit merged to main like anything else, auto-tagged like anything
# else. The ONLY difference is a human runs nominate:int with FORCE=true,
# which preempts (pauses, does not lose) whatever candidate is currently
# under UAT. ci/resume-int.sh brings the paused candidate back afterward.
# This requires "keep main always-shippable" discipline (feature flags for
# unfinished work) — see doc 2.
#
# HUMAN GATES (exactly three, each with a distinct purpose):
#   1. MR review              — code correctness (lead/reviewer)
#   2. nominate:int             — "this candidate is ready for UAT"
#   3. promote:stable            — "UAT passed, ship it"
#   (deploy:prod itself is auto once promote:stable succeeds — see below;
#    make it manual too if you want a 4th explicit gate, it's one line)
#
# ROLLBACK — scoped to where the stakes justify it (see rollback design
# discussion):
#   dev:  none at all. Broken dev stays broken and visible — that's its job.
#   int:  manual only, lightweight (ci/rollback-int.sh). No auto-rollback:
#         a broken UAT candidate should stay visible for debugging, not
#         silently revert. Distinct from resume-int.sh (hotfix pause/resume,
#         not failure).
#   prod: full automatic (on failed health check AND failed smoke) +
#         manual button. Real users, real stakes — this is the one
#         environment where speed of recovery matters enough to automate.
#
# PREFLIGHT: ci/preflight.sh runs at the top of every job that touches a
# VM (build or env). Fails fast and by name if docker/jf/vault/disk/etc
# aren't ready — so "Retry" after fixing the VM is unambiguous and safe
# (see idempotency notes below).
#
# IDEMPOTENCY: every mutating job checks "has this already happened?"
# before acting, so clicking "Retry" on a failed job is always safe:
#   - publish:scratch    checks if this exact digest is already at this tag
#   - release:tag         checks if the tag already exists on this commit
#   - promote:staging/stable  check target digest before promoting (already
#                              had this from the JFrog-move design)
#   - nominate:int         uses an atomic mkdir lock, not a racy read-check-write
#   - deploy scripts        docker compose up -d is naturally idempotent
#
# ============================================================================

variables:
  IMAGE_NAME: "reportapp"
  DOCKER_REGISTRY: "jfrog.company.com"
  SCRATCH_REPO: "docker-scratch-local"
  STAGING_REPO: "docker-staging-local"
  STABLE_REPO: "docker-stable-local"
  SBOM_REPO: "generic-sboms-local"
  APP_DIR: "/opt/apps/reportapp"
  GIT_DEPTH: 0

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'
    # no release/* or hotfix/* branch rule — fix-forward only, no branch path

stages:
  - validate
  - test
  - build
  - publish
  - deploy-dev
  - integration
  - release
  - promote-staging
  - nominate-int
  - e2e-int
  - promote-stable
  - deploy-prod
  - smoke-prod

# ----------------------------------------------------------------------------
# STAGE: validate
# ----------------------------------------------------------------------------
lint:commit-message:
  stage: validate
  tags: [build]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pip install --quiet commitizen
    - echo "$CI_MERGE_REQUEST_TITLE" | cz check --message -
  allow_failure: true   # remove once the team is used to the format

# ----------------------------------------------------------------------------
# STAGE: test — white-box, every MR
# ----------------------------------------------------------------------------
lint:code:
  stage: test
  tags: [build]
  script:
    - ./ci/preflight.sh build
    - uv sync --frozen
    - uv run ruff check .
    - uv run mypy app/
    - uv run bandit -r app/ -ll

test:unit:
  stage: test
  tags: [build]
  script:
    - uv sync --frozen
    - uv run pytest tests/unit tests/streamlit_apptest -m "not integration" \
        --junitxml=report.xml --cov=app
  artifacts:
    when: always
    reports:
      junit: report.xml

scan:source-dependencies:
  stage: test
  tags: [build]
  script:
    - uv sync --frozen
    - uv run pip-audit --format=cyclonedx-json -o sbom-source-deps.json
  artifacts:
    paths: [sbom-source-deps.json]
  allow_failure: true

# ----------------------------------------------------------------------------
# STAGE: build — version tagged HERE, at merge, against live HEAD
# ----------------------------------------------------------------------------
build:image:
  stage: build
  tags: [build]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - ./ci/preflight.sh build
    - pip install --quiet python-semantic-release
    - export NEXT_VERSION=$(semantic-release version --print)
    - |
      if [ -z "$NEXT_VERSION" ]; then
        echo "No feat/fix commits since last tag — nothing release-worthy."
        export APP_VERSION="0.0.0.dev${CI_PIPELINE_IID}+${CI_COMMIT_SHORT_SHA}"
        export BUILD_VERSION="0.0.0-dev${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"
      else
        export APP_VERSION="${NEXT_VERSION}.dev${CI_PIPELINE_IID}+${CI_COMMIT_SHORT_SHA}"
        export BUILD_VERSION="${NEXT_VERSION}-dev${CI_PIPELINE_IID}-${CI_COMMIT_SHORT_SHA}"
      fi
    - echo "NEXT_VERSION=$NEXT_VERSION" > build.env
    - echo "APP_VERSION=$APP_VERSION" >> build.env
    - echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
    - export SETUPTOOLS_SCM_PRETEND_VERSION=$APP_VERSION
    - docker build --build-arg APP_VERSION=$APP_VERSION
        -t $DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION .
    - jf rt build-collect-env reportapp-build $CI_PIPELINE_ID
    - jf rt build-add-git reportapp-build $CI_PIPELINE_ID
  artifacts:
    reports:
      dotenv: build.env

build:sbom:
  stage: build
  tags: [build]
  needs: [build:image]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - syft $DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION
        -o cyclonedx-json=sbom-$BUILD_VERSION.cdx.json
        -o spdx-json=sbom-$BUILD_VERSION.spdx.json
    - jf rt upload "sbom-$BUILD_VERSION.*.json"
        "$SBOM_REPO/$IMAGE_NAME/$BUILD_VERSION/"
        --build-name=reportapp-build --build-number=$CI_PIPELINE_ID
  artifacts:
    paths: ["sbom-*.json"]

# ----------------------------------------------------------------------------
# STAGE: publish — IDEMPOTENT: checks if this exact digest already exists
# at this tag before pushing, so retrying after a partial failure is safe.
# ----------------------------------------------------------------------------
publish:scratch:
  stage: publish
  tags: [build]
  needs: [build:image, build:sbom]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      EXISTING_DIGEST=$(jf rt curl -s "/api/docker/$SCRATCH_REPO/v2/$IMAGE_NAME/manifests/$BUILD_VERSION" \
        -H "Accept: application/vnd.docker.distribution.manifest.v2+json" 2>/dev/null \
        | jq -r '.config.digest // empty' || echo "")
      LOCAL_DIGEST=$(docker inspect --format='{{index .Id}}' \
        "$DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION" 2>/dev/null || echo "")
      if [ -n "$EXISTING_DIGEST" ] && [ "$EXISTING_DIGEST" == "$LOCAL_DIGEST" ]; then
        echo "Tag $BUILD_VERSION already published with matching digest — skipping push"
      else
        docker push $DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION
      fi
    - jf rt build-publish reportapp-build $CI_PIPELINE_ID
  artifacts:
    reports:
      dotenv: build.env

publish:wait-for-scan:
  stage: publish
  tags: [build]
  needs: [publish:scratch]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - jf rt build-scan reportapp-build $CI_PIPELINE_ID --fail=false --vuln
  artifacts:
    reports:
      dotenv: build.env

# ----------------------------------------------------------------------------
# STAGE: deploy-dev — auto, NO rollback of any kind (see design summary)
# ----------------------------------------------------------------------------
deploy:dev:
  stage: deploy-dev
  tags: [dev]
  needs: [publish:wait-for-scan]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  environment:
    name: dev
  resource_group: dev
  script:
    - export IMAGE="$DOCKER_REGISTRY/$SCRATCH_REPO/$IMAGE_NAME:$BUILD_VERSION"
    - ./ci/deploy.sh dev "$IMAGE" "$BUILD_VERSION"
    # NOTE: no rollback wrapper here, deliberately. If this fails, the
    # pipeline goes red and dev stays broken — read the logs, fix forward.

test:smoke-dev:
  stage: deploy-dev
  tags: [dev]
  needs: [deploy:dev]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    BASE_URL: "http://localhost:8501"
  script:
    - ./ci/run-e2e.sh smoke

# ----------------------------------------------------------------------------
# STAGE: integration — white-box, real throwaway DB
# ----------------------------------------------------------------------------
test:integration:
  stage: integration
  tags: [build]
  needs: [test:smoke-dev]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  services:
    - postgres:15
  variables:
    POSTGRES_DB: testdb
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: "postgresql://test:test@postgres/testdb"
  script:
    - uv sync --frozen
    - uv run pytest tests/integration -m integration --junitxml=integration-report.xml
  artifacts:
    when: always
    reports:
      junit: integration-report.xml

# ----------------------------------------------------------------------------
# STAGE: release — IDEMPOTENT: checks if the tag already exists on this
# commit before creating it, so a retry after a partial failure (e.g. the
# changelog/release-cli step crashed after the tag was already pushed)
# doesn't error out on "tag already exists" — it just proceeds.
# ----------------------------------------------------------------------------
release:tag:
  stage: release
  tags: [build]
  needs: [build:image, test:integration]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - |
      if [ -z "$NEXT_VERSION" ]; then
        echo "No release-worthy commits since last tag. Skipping release."
        exit 0
      fi
    - pip install --quiet python-semantic-release
    - git remote set-url origin "https://release-bot:${RELEASE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
    - |
      if git rev-parse "v${NEXT_VERSION}" >/dev/null 2>&1; then
        EXISTING_COMMIT=$(git rev-list -n1 "v${NEXT_VERSION}")
        if [ "$EXISTING_COMMIT" == "$CI_COMMIT_SHA" ]; then
          echo "Tag v${NEXT_VERSION} already exists on this commit — retry-safe, continuing"
        else
          echo "ERROR: v${NEXT_VERSION} already exists on a DIFFERENT commit ($EXISTING_COMMIT)."
          echo "This should not happen with tag-at-merge — investigate before retrying."
          exit 1
        fi
      else
        semantic-release changelog > release-notes.md
        git tag -a "v${NEXT_VERSION}" -m "v${NEXT_VERSION}"
        git push origin "v${NEXT_VERSION}"
      fi
    - |
      if [ -f release-notes.md ]; then
        release-cli create --tag-name "v${NEXT_VERSION}" --name "v${NEXT_VERSION}" \
          --description "$(cat release-notes.md)" || echo "Release object may already exist — continuing"
      fi
  artifacts:
    paths: [release-notes.md]
    when: always

# ============================================================================
# Everything below runs on tag pipelines (CI_COMMIT_TAG set)
# ============================================================================

# ----------------------------------------------------------------------------
# STAGE: promote-staging — already idempotent by design (checks digest
# before promoting). Xray severity enforcement happens here.
# ----------------------------------------------------------------------------
promote:staging:
  stage: promote-staging
  tags: [build]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - ./ci/preflight.sh build
    - export VERSION=${CI_COMMIT_TAG#v}
    - export SRC_TAG=$(jf rt search "$SCRATCH_REPO/$IMAGE_NAME/*" --props="vcs.revision=$CI_COMMIT_SHA" | jq -r '.[0].path' | xargs basename)
    - |
      if ! jf rt build-promote reportapp-build $CI_PIPELINE_ID $STAGING_REPO --copy=true 2> promote-error.log; then
        if grep -qi "pending approval" promote-error.log; then
          echo "High-severity CVE found — promotion pending approval in JFrog:"
          echo "  https://$DOCKER_REGISTRY/ui/bundles/${IMAGE_NAME}/${VERSION}"
          exit 1
        fi
        if grep -qi "already exists" promote-error.log; then
          echo "Already promoted (retry-safe) — continuing"
        else
          cat promote-error.log
          exit 1
        fi
      fi
    - jf rt docker-promote $IMAGE_NAME $SCRATCH_REPO $STAGING_REPO
        --source-tag=$SRC_TAG --target-tag=$VERSION --copy=true
  artifacts:
    reports:
      dotenv: build.env

# ----------------------------------------------------------------------------
# STAGE: nominate-int — MANUAL GATE #2. Atomic occupancy lock (see
# ci/nominate-int.sh). This is the "ready for UAT" decision.
#
# For a hotfix: run this job with FORCE=true set as a manual pipeline
# variable when triggering it, to preempt whatever's currently in UAT.
# ----------------------------------------------------------------------------
nominate:int:
  stage: nominate-int
  tags: [int]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  environment:
    name: int
  resource_group: int
  script:
    - ./ci/preflight.sh env
    - export VERSION=${CI_COMMIT_TAG#v}
    - export IMAGE="$DOCKER_REGISTRY/$STAGING_REPO/$IMAGE_NAME:$VERSION"
    - ./ci/nominate-int.sh "$IMAGE" "$VERSION" "${FORCE:-false}"

# manual, standalone: bring back a hotfix-displaced candidate once the
# hotfix has shipped and its lock was released (see promote:stable)
resume:int:
  stage: nominate-int
  tags: [int]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  environment:
    name: int
  script:
    - ./ci/preflight.sh env
    - ./ci/resume-int.sh

# manual, standalone: "the current UAT candidate is behaving badly, put
# the last known-good back" — distinct from resume (which is about
# pausing, not failure). No auto-rollback on int, by design.
rollback:int:
  stage: nominate-int
  tags: [int]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  environment:
    name: int
  script:
    - ./ci/rollback-int.sh

# ----------------------------------------------------------------------------
# STAGE: e2e-int — black-box, full flow, real int deployment
# ----------------------------------------------------------------------------
test:e2e-int:
  stage: e2e-int
  tags: [int]
  needs: [nominate:int]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  variables:
    BASE_URL: "http://localhost:8501"
  script:
    - ./ci/run-e2e.sh e2e

test:evaluation:
  stage: e2e-int
  tags: [build]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - export VAULT_TOKEN=$(vault write -field=token auth/jwt/login role=reportapp-ci jwt=$CI_JOB_JWT)
    - export LLM_API_KEY=$(vault kv get -field=api_key secret/reportapp/ci-eval)
    - uv sync --frozen
    - uv run pytest tests/evaluation --junitxml=eval-report.xml
  artifacts:
    when: always
    reports:
      junit: eval-report.xml

# ----------------------------------------------------------------------------
# STAGE: promote-stable — MANUAL GATE #3, the "UAT passed, ship it"
# decision. Also releases the int occupancy lock — UAT is over either way
# once this runs (approved here; a rejected candidate just never reaches
# this job — someone fixes forward and nominates a new version instead).
# ----------------------------------------------------------------------------
promote:stable:
  stage: promote-stable
  tags: [build]
  needs: [test:e2e-int, test:evaluation]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  script:
    - ./ci/preflight.sh build
    - export VERSION=${CI_COMMIT_TAG#v}
    - |
      if ! jf rt docker-promote $IMAGE_NAME $STAGING_REPO $STABLE_REPO \
          --source-tag=$VERSION --target-tag=$VERSION --copy=true 2> promote-error.log; then
        if grep -qi "pending approval" promote-error.log; then
          echo "High-severity CVE found — promotion pending approval in JFrog."
          exit 1
        fi
        if grep -qi "already exists" promote-error.log; then
          echo "Already promoted (retry-safe) — continuing"
        else
          cat promote-error.log
          exit 1
        fi
      fi
    - jf rt docker-promote $IMAGE_NAME $STAGING_REPO $STABLE_REPO
        --source-tag=$VERSION --target-tag=stable --copy=true
  artifacts:
    reports:
      dotenv: build.env

# separate job so it can be triggered independently: releases int's
# occupancy lock once a candidate's UAT has concluded (approved or
# rejected) so the next nomination isn't refused forever
release:int-lock:
  stage: promote-stable
  tags: [int]
  needs: [promote:stable]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - ./ci/release-int-lock.sh

# ----------------------------------------------------------------------------
# STAGE: deploy-prod — automatic once promote:stable is clicked (or make
# this `when: manual` too for a 4th explicit gate — one line to add).
# Full auto-rollback lives here (ci/deploy-prod.sh wraps deploy.sh +
# rollback.sh) — this is the one environment where that's justified.
# ----------------------------------------------------------------------------
deploy:prod:
  stage: deploy-prod
  tags: [prod]
  needs: [promote:stable]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  environment:
    name: prod
  resource_group: prod
  script:
    - ./ci/preflight.sh env
    - export VERSION=${CI_COMMIT_TAG#v}
    - export IMAGE="$DOCKER_REGISTRY/$STABLE_REPO/$IMAGE_NAME:$VERSION"
    - ./ci/deploy-prod.sh "$IMAGE" "$VERSION"

# standing manual rollback button, no expiry — full script, prod stakes
rollback:prod:
  stage: deploy-prod
  tags: [prod]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
      when: manual
  environment:
    name: prod
  script:
    - ./ci/rollback.sh prod

# ----------------------------------------------------------------------------
# STAGE: smoke-prod — auto-rollback on failure (login-only, blocking).
# Full query check is non-blocking.
# ----------------------------------------------------------------------------
test:smoke-prod:
  stage: smoke-prod
  tags: [prod]
  needs: [deploy:prod]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  variables:
    BASE_URL: "https://reportapp.company.com"
  script:
    - ./ci/run-e2e.sh smoke
  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        echo "Smoke test failed — rolling back prod"
        ./ci/rollback.sh prod
      fi

test:smoke-prod-full-query:
  stage: smoke-prod
  tags: [prod]
  needs: [test:smoke-prod]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  allow_failure: true
  script:
    - ./ci/run-e2e.sh smoke-full
